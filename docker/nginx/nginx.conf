## ─────────────────────────────────────────────────────────────────────────────
## Config DEFINITIVA — HTTPS em app.grubba.com.br
## Só use depois que o certificado Let's Encrypt já tiver sido emitido,
## senão o nginx não sobe (não encontra os arquivos .pem).
## ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: só renovação de certificado e redirect para HTTPS ───────────────────
server {
    listen 80;
    server_name app.grubba.com.br 89.117.56.141;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.grubba.com.br$request_uri;
    }
}

# ── HTTPS: a aplicação ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.grubba.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.grubba.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.grubba.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # DNS interno do Docker: resolve os containers a cada request, em vez de
    # cachear o IP no boot (era o que causava o 502 depois de cada rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend_upstream http://frontend:80;
    set $api_upstream      http://api:8000;

    # ── Frontend assets do Vite ────────────────────────────────────────────────
    location /assets/ {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Arquivos estáticos comuns ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ── Docs do FastAPI ────────────────────────────────────────────────────────
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend React SPA ─────────────────────────────────────────────────────
    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Segurança ──────────────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}