## ─────────────────────────────────────────────────────────────────────────────
## CONFIG TEMPORÁRIA — usada APENAS para emitir o certificado Let's Encrypt.
## Só HTTP, sem redirect para HTTPS (o certbot precisa acessar a porta 80).
## Depois de emitir o certificado, troque pelo nginx.conf definitivo.
## ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name app.grubba.com.br 89.117.56.141;

    client_max_body_size 50M;

    # DNS interno do Docker: resolve os containers a cada request, em vez de
    # cachear o IP no boot (era o que causava o 502 depois de cada rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend_upstream http://frontend:80;
    set $api_upstream      http://api:8000;

    # ── Desafio do Let's Encrypt ───────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Frontend assets do Vite ────────────────────────────────────────────────
    location /assets/ {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Arquivos estáticos comuns ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ── Docs do FastAPI ────────────────────────────────────────────────────────
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend React SPA ─────────────────────────────────────────────────────
    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Segurança ──────────────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}